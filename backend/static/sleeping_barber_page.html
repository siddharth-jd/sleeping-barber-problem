<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeping Barber Simulation</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        let lastStatusUpdate = "";
        
        async function fetchStatus() {
            try {
                const response = await fetch("/status");
                const data = await response.json();
                
                // Only update if there's new content
                if (data.status !== lastStatusUpdate) {
                    lastStatusUpdate = data.status;
                    document.getElementById("status").textContent = data.status;
                }
            } catch (error) {
                console.error("Error fetching status:", error);
            }
        }

        async function sendCommand(command) {
            try {
                const commandInput = document.getElementById("command-input");
                const chairsInput = document.getElementById("chairs-input");
                
                let fullCommand = command || commandInput.value;
                
                // If this is a start command, append the chairs parameter
                if ((fullCommand === "start" || fullCommand.startsWith("start ")) && !command) {
                    const chairsValue = chairsInput.value.trim() || "5";
                    const numCustomers = fullCommand.split(" ")[1] || "10";
                    
                    // Create command with format: start [customers] [chairs]
                    fullCommand = `start ${numCustomers} ${chairsValue}`;
                } else if (fullCommand === "start" && !command) {
                    // If just "start" with no parameters, use defaults
                    const chairsValue = chairsInput.value.trim() || "5";
                    fullCommand = `start 10 ${chairsValue}`;
                }
                
                const response = await fetch("/command", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ command: fullCommand }),
                });
                const data = await response.json();
                alert(data.response);
                
                // Force a status refresh
                lastStatusUpdate = "";
                fetchStatus();
            } catch (error) {
                console.error("Error sending command:", error);
                alert("Failed to send command: " + error.message);
            }
        }
    </script>
</head>
<body>
    <h1>Sleeping Barber Simulation</h1>
    <div>
        <h3>Status</h3>
        <pre id="status">Loading...</pre>
        <button onclick="fetchStatus()">Refresh Status</button>
    </div>
    <div>
        <h3>Commands</h3>
        <div class="input-group">
            <label for="command-input">Command:</label>
            <input id="command-input" placeholder="Enter command (e.g., start 10)" />
        </div>
        <div class="input-group">
            <label for="chairs-input">Number of Chairs:</label>
            <input id="chairs-input" type="number" min="1" placeholder="Number of waiting chairs" value="5" />
        </div>
        <button onclick="sendCommand()">Send Command</button>
        <button onclick="sendCommand('stop')">Stop Simulation</button>
        <button onclick="sendCommand('reset')">Reset Simulation</button>
        <button onclick="sendCommand('add_customer')">Add Customer</button>
    </div>
    <script>
        // Setup auto-refresh for status
        fetchStatus(); // Initial load
    </script>
</body>
</html>
